<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" href="../img/3_enemies_chicken/chicken_normal/1_walk/3_w.png">
    <title>El Pollo Loco</title>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/chicken-small.class.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/status-bar-coin.class.js"></script>
    <script src="./models/status-bar-bottle.class.js"></script>
    <script src="./models/status-bar-endboss.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/startscreen.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/coins.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>
</head>

<body onload="init();">

    <h1>El Pollo Loco</h1>


    <div class="game-container">
        <canvas id="canvas" width="720" height="480">
        </canvas>
        <div id="game-over" class="game-over" role="dialog" aria-labelledby="game-over-heading" hidden>
            <img src="../img/You won, you lost/You lost.png" alt="You lost">
            <div>
                <button type="button" onclick="restartGame()">Restart round</button>
                <button type="button" onclick="goToMenu()">Main menu</button>
            </div>
        </div>
        <div id="game-won" class="game-won" role="dialog" aria-labelledby="game-won-heading" hidden>
            <img src="../img/You won, you lost/You won A.png" alt="You won">
            <div>
                <button type="button" onclick="restartGame()">Restart round</button>
                <button type="button" onclick="goToMenu()">Main menu</button>
            </div>
        </div>
        <div id="start-screen" class="start-screen" onclick="startGame()">
            <img src='./img/9_intro_outro_screens/start/startscreen_1.png' alt='Start screen' id='start-screen'>
        </div>
    </div>

    <section class="controls" aria-labelledby="controls-heading">
        <h2 id="controls-heading">Controls</h2>
        <ul>
            <li><kbd>←</kbd> Move left</li>
            <li><kbd>→</kbd> Move right</li>
            <li><kbd>Space</kbd> Jump</li>
            <li><kbd>D</kbd> Throw</li>
        </ul>
    </section>



</body>

</html>
